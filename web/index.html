<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#fafafa" />
    <meta name="description" content="基于 Cloudflare 的 Agent 记忆系统" />
    <title>Workmory · Agent 记忆系统</title>
    <script>
      (() => {
        const read = (key) => {
          try {
            const value = localStorage.getItem(key);
            if (value === null) return null;
            try {
              const parsed = JSON.parse(value);
              return typeof parsed === "string" ? parsed : value;
            } catch {
              return value;
            }
          } catch {
            return null;
          }
        };
        const storedTheme = read("workmory.theme");
        const theme = ["light", "dark", "system"].includes(storedTheme) ? storedTheme : "system";
        const dark = theme === "dark" || (theme === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
        document.querySelector('meta[name="theme-color"]')?.setAttribute("content", dark ? "#171717" : "#fafafa");

        const storedLocale = read("workmory.locale");
        const browserLocale = navigator.language;
        const locale = ["zh-CN", "en"].includes(storedLocale)
          ? storedLocale
          : browserLocale
            ? /^zh(?:-|$)/i.test(browserLocale) ? "zh-CN" : "en"
            : "zh-CN";
        document.documentElement.lang = locale;
        const metadata = locale === "en"
          ? { title: "Workmory · Agent Memory System", description: "An agent memory system built on Cloudflare" }
          : { title: "Workmory · Agent 记忆系统", description: "基于 Cloudflare 的 Agent 记忆系统" };
        document.title = metadata.title;
        document.querySelector('meta[name="description"]')?.setAttribute("content", metadata.description);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>

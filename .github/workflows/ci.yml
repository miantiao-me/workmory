name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.4.0

      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 24

      - name: Enable pinned pnpm via Corepack
        run: corepack enable && test "$(pnpm --version)" = "11.22.0"

      - name: Locate pnpm store
        id: pnpm-cache
        run: echo "store=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4.3.0
        with:
          path: ${{ steps.pnpm-cache.outputs.store }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level high
      - run: pnpm migration:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:workers
      - run: pnpm deploy:dry-run
